server {
    server_name ucl.rfotbal.ro;

    proxy_intercept_errors on;
    error_page 502 503 504 /ucl-502.html;

    location = /ucl-502.html {
        internal;
        root /var/www/ucl-errors;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "20" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ucl.rfotbal.ro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ucl.rfotbal.ro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = ucl.rfotbal.ro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name ucl.rfotbal.ro;
    return 404; # managed by Certbot
}
