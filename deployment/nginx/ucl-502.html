<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UCL r/fotbal · Pauză tehnică</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 110%,#314fc7,transparent 42%),linear-gradient(145deg,#030416,#0b1042 65%,#100a3c);color:#f7f8ff;font-family:system-ui,sans-serif}.card{width:min(520px,100%);border:1px solid #ffffff28;border-radius:24px;padding:32px;background:#070a2ddd;box-shadow:0 32px 90px #0008;text-align:center}.orbit{width:90px;height:90px;margin:auto;border:2px solid #54d8ff;border-radius:50%;box-shadow:0 0 32px #54d8ff55;display:grid;place-items:center;font-size:34px}.tag{margin:24px 0 8px;color:#54d8ff;font-size:12px;font-weight:900;letter-spacing:.2em}h1{margin:0;font-size:clamp(34px,8vw,56px);line-height:.95}p{color:#aeb5dc;line-height:1.6}.count{font-size:13px;color:#54d8ff}button{border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(135deg,#4d72ff,#9a6cff);color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="orbit">✦</div><p class="tag">PAUZĂ TEHNICĂ</p><h1>Nocturna revine imediat.</h1><p>UCL r/fotbal primește ultimele indicații. Reîncercăm automat.</p><p class="count">Reîncercare în <strong id="count">20</strong></p><button onclick="location.reload()">Încearcă acum</button></main><script>let n=20;setInterval(()=>{n-=1;document.getElementById('count').textContent=String(n);if(n<=0)location.reload()},1000)</script></body>
</html>
